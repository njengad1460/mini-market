services:
  mongo:
    image: mongo:7-jammy
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: always
    expose:
      - "5000"
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=production
      # MONGO_URI comes from backend/.env (Atlas) — do NOT override here unless using local Docker MongoDB
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=
        - VITE_COGNITO_USER_POOL_ID=${VITE_COGNITO_USER_POOL_ID:-}
        - VITE_COGNITO_CLIENT_ID=${VITE_COGNITO_CLIENT_ID:-}
        - VITE_COGNITO_DOMAIN=${VITE_COGNITO_DOMAIN:-}
        - VITE_REDIRECT_SIGN_IN=${VITE_REDIRECT_SIGN_IN:-http://localhost:8080/auth/callback}
        - VITE_REDIRECT_SIGN_OUT=${VITE_REDIRECT_SIGN_OUT:-http://localhost:8080/}
    container_name: frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
